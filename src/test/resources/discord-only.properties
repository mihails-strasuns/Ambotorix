# A deployment with only Discord configured — deliberately no bot.token, which is what makes the
# Telegram adapter drop out. Loaded via spring.config.location so the usual test
# application.properties (which sets bot.token) does not apply.
discord.token=test-discord-token
bot.discord-admin-id=999999999

data.dir=src/main/resources
data.update.on-startup=false

logging.level.vitbuk.com.Ambotorix=WARN
